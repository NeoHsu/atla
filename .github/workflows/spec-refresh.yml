name: Refresh Atlassian specs

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: spec-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Refresh partial specs and manifest
        run: scripts/update-specs.sh
      - name: Verify generated clients and contracts
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --locked
          cargo test --workspace --locked
      - name: Summarize partial-spec changes
        run: |
          python3 scripts/spec-diff-summary.py \
            --base HEAD \
            --output "${RUNNER_TEMP}/spec-refresh-pr.md"
          cat "${RUNNER_TEMP}/spec-refresh-pr.md" >> "${GITHUB_STEP_SUMMARY}"
      - name: Open a reviewable update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/refresh-atlassian-specs
          delete-branch: true
          commit-message: "chore(specs): refresh Atlassian partial specs"
          title: "chore(specs): refresh Atlassian partial specs"
          body-path: ${{ runner.temp }}/spec-refresh-pr.md
          labels: dependencies
          add-paths: |
            specs/**
