[package]
name = "atla-jira-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
progenitor = "0.14"
serde_json = "1"
openapiv3 = "2"
syn = { version = "3", features = ["full"] }
prettyplease = "0.3"

[dependencies]
progenitor-client = "0.14"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true

# These runtime dependencies are referenced by the Progenitor output generated in OUT_DIR.
[package.metadata.cargo-machete]
ignored = ["progenitor-client", "reqwest", "serde", "serde_json"]
